# Fly.io config for Congrats. See DEPLOY.md for the full walkthrough.
#
#   fly launch --no-deploy        # create the app (edit the name below if taken)
#   fly postgres create           # create a managed Postgres, then attach it:
#   fly postgres attach <pg-app>  # sets DATABASE_URL secret automatically
#   fly secrets set AUTH_SECRET=$(openssl rand -base64 32) AUTH_TRUST_HOST=true \
#       AUTH_URL=https://<app>.fly.dev SEED_ADMIN_EMAIL=admin@congrats.dev \
#       SEED_ADMIN_PASSWORD=$(openssl rand -base64 12) INSTAPAY_HANDLE=you@instapay
#   fly deploy
#
# AUTH_URL may be omitted: the entrypoint defaults it to https://$FLY_APP_NAME.fly.dev.
# Optional runtime secrets: RESEND_API_KEY, EMAIL_FROM, SENTRY_DSN.
# Build-time values (inlined into the bundle / CSP) go in [build.args] below —
# `fly secrets` are NOT visible to the Docker build.

app = "congrats"
primary_region = "cdg"  # Paris — closest low-latency region to Egypt/MENA on Fly

[build]
  dockerfile = "Dockerfile"

  # Uncomment and fill to enable analytics / client error tracking / legal
  # details. Also set the same NEXT_PUBLIC_* names under [env] so the boot-time
  # env check sees them.
  # [build.args]
  #   NEXT_PUBLIC_PLAUSIBLE_DOMAIN = "congrats.example.com"
  #   NEXT_PUBLIC_COMPANY_NAME = "Your Company"
  #   NEXT_PUBLIC_SUPPORT_EMAIL = "support@example.com"
  #   SENTRY_DSN = "https://<key>@o<org>.ingest.sentry.io/<project>"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
