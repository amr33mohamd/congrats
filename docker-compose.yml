# Default stack: a single self-contained container.
# The app uses in-process PGlite (no external database) and persists PGlite data
# + uploaded media to the `congrats-data` volume. Fully offline.
#
#   docker compose up --build
#
# For a production-like Postgres stack instead, layer the override file:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Build-time config (inlined into the bundle / CSP). Empty = feature off.
      args:
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        SENTRY_DSN: ${SENTRY_DSN:-}
        CSP_ENFORCE: ${CSP_ENFORCE:-}
    image: congrats:latest
    ports:
      # Host port is configurable (default 3000) so it can avoid conflicts.
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Persist PGlite + local uploads under the mounted volume.
      PGLITE_PATH: /app/.data/pglite
      # This default stack deliberately runs without Postgres; lib/env.ts
      # refuses that in production unless it is acknowledged here.
      ALLOW_PGLITE_IN_PRODUCTION: "true"
      LOCAL_STORAGE_ROOT: /app/.data/uploads
      STORAGE_DRIVER: local
      # Auth.js (NextAuth v5). Leave AUTH_SECRET unset and the entrypoint
      # generates a strong random one (persisted to the volume). Set it
      # explicitly for multi-instance production. NEVER a known/committed value.
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@congrats.dev}
      # Leave SEED_ADMIN_PASSWORD unset → the entrypoint generates one and prints
      # it once in the logs. Set it to choose your own.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      INSTAPAY_HANDLE: ${INSTAPAY_HANDLE:-congrats@instapay}
      # Optional: transactional email for password reset (falls back to logging).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Optional: error tracking + analytics + legal/contact details.
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
      NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
    volumes:
      - congrats-data:/app/.data
    restart: unless-stopped

volumes:
  congrats-data:
