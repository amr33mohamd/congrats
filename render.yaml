# Render Blueprint — one-click deploy of Congrats + a managed Postgres.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. On render.com → New → Blueprint → connect this repo.
#   3. Render reads this file, provisions the DB + web service, generates
#      AUTH_SECRET and the admin password, and runs the Docker build.
#   4. After the first deploy, set AUTH_URL to the service's public URL
#      (e.g. https://congrats.onrender.com) and redeploy, then set
#      INSTAPAY_HANDLE (and RESEND_API_KEY/EMAIL_FROM for password-reset email).
#
# The entrypoint auto-runs versioned migrations (drizzle/) + the idempotent seed.

databases:
  - name: congrats-db
    databaseName: congrats
    plan: free # ⚠ free DB expires after ~30 days — upgrade to a paid plan for production.

services:
  - type: web
    name: congrats
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # free tier (spins down when idle). Upgrade to 'starter' for always-on.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: congrats-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true # strong random secret, managed by Render
      - key: AUTH_TRUST_HOST
        value: 'true'
      # Set this to your public URL after the first deploy, then redeploy.
      - key: AUTH_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@congrats.dev
      - key: SEED_ADMIN_PASSWORD
        generateValue: true # printed once in the deploy logs on first boot
      # Optional — fill in the dashboard:
      - key: INSTAPAY_HANDLE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
